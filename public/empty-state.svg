<svg xmlns="http://www.w3.org/2000/svg" width="270" height="211" viewBox="0 0 270 211" fill="none">
  <!-- Stacked papers behind the clipboard -->
  <g opacity="0.5">
    <!-- Bottom paper -->
    <rect x="55" y="145" width="140" height="10" rx="3" fill="#D1D5DB" transform="rotate(-8 55 145)"/>
    <!-- Middle paper -->
    <rect x="50" y="135" width="150" height="10" rx="3" fill="#E5E7EB" transform="rotate(-4 50 135)"/>
  </g>

  <!-- Clipboard body -->
  <rect x="60" y="30" width="150" height="170" rx="12" fill="#9CA3AF"/>
  <rect x="68" y="50" width="134" height="142" rx="8" fill="#F9FAFB"/>

  <!-- Clipboard clip at top -->
  <rect x="100" y="20" width="70" height="25" rx="6" fill="#6B7280"/>
  <rect x="115" y="16" width="40" height="14" rx="7" fill="#9CA3AF"/>

  <!-- Lined content on clipboard -->
  <rect x="85" y="70" width="100" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="85" y="88" width="80" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="85" y="106" width="90" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="85" y="124" width="70" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="85" y="142" width="60" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="85" y="160" width="85" height="6" rx="3" fill="#E5E7EB"/>
</svg>
